[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harborlens"
version = "1.0.0"
description = "Free DORA assessment for a Git repository. Harbor Glass is the paid collector."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Spiral Harbor" }]
keywords = ["dora", "devops", "metrics"]
dependencies = ["python-dotenv", "pytest"]

[project.urls]
Homepage = "https://spiralharbor.com"
Documentation = "https://spiralharbor.com/glass"

[project.scripts]
harborlens = "harborlens.cli:console_main"

[tool.setuptools]
packages = ["harborlens"]

[tool.pytest.ini_options]
pythonpath = ["."]
